# SuperMimic velocity-command state for the G1 EDU U2 (29 DoF).
#
# Operator flow:
#   [L2 + UP]        FixStand: ramp to the standing pose and hold
#   [RB + X]         SuperMimicVelocity: the exported ONNX policy takes over at 50 Hz
#   edit config/velocity_cmd.yaml   change vx/vy/wz (file is polled at 10 Hz, then clipped)
#   [L2 + B]         abort to Passive damping at any point
#
# The velocity goal is body-frame [vx, vy, wz] and is clamped inside the package to
# vx[-0.10, 1.00], vy[-0.10, 0.10], wz[-1.50, 1.50] m/s, rad/s. Measured on the trained
# policy: 1.1 m/s tracks within 2 %, backward commands diverge (0.3 -> 0.83), sideways is
# weak and asymmetric, so the clip keeps the operator inside the validated envelope.
# Keep the gantry attached for the first runs: damping after an abort does not hold the
# robot up.
